name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run Playwright suite
    # Skip on a "closed" pull_request event (added to the trigger above only
    # so cleanup-pr-report, below, can run on it) - there's no new code to
    # test when a PR is just closing.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: run_tests
        run: npx playwright test
        continue-on-error: true

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright JUnit Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload raw test-results (videos, traces, junit.xml)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # The HTML report (viewable in-browser, with an embedded player for every
      # test's video and an embedded trace viewer) is published to GitHub Pages
      # instead of only being offered as a zip download - see DECISIONS.md
      # ("Publish the HTML report to GitHub Pages"). Runs from a fork's PR are
      # skipped: the default token has no write access to push gh-pages content
      # there.
      - name: Determine report destination
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: report_meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=reports/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=reports/main" >> "$GITHUB_OUTPUT"
          fi

      # A hand-rolled deploy, not peaceiris/actions-gh-pages: an earlier
      # version of this step ran a separate "clear stale files" push
      # immediately before peaceiris's own push to the same branch, and the
      # two didn't coordinate - peaceiris pushed based on a ref it had
      # already fetched, so its push was rejected as non-fast-forward right
      # after the clearing commit landed (confirmed by a real CI run: "the
      # remote contains work that you do not have locally"). Doing the
      # clear-then-copy-then-commit-then-push as one continuous sequence in
      # a single step, with nothing else touching the branch in between,
      # removes that coordination problem at the root rather than trying to
      # patch around a second actor's internal caching. See DECISIONS.md
      # ("Stop gh-pages report directories from growing forever").
      #
      # destination_dir's own old content is cleared first (Playwright names
      # every run's video/trace files by content hash, so nothing would
      # otherwise collide or ever get removed - confirmed reports/main grew
      # by 50-100 files on every single push before this fix existed);
      # every other path on gh-pages (every other open PR's own report) is
      # left untouched, since only this one destination_dir is ever removed.
      - name: Publish HTML report to GitHub Pages
        if: always() && steps.report_meta.outcome == 'success'
        run: |
          DIR="${{ steps.report_meta.outputs.dir }}"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages-deploy origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-deploy
          fi
          rm -rf "gh-pages-deploy/$DIR"
          mkdir -p "gh-pages-deploy/$DIR"
          cp -r playwright-report/. "gh-pages-deploy/$DIR/"
          touch gh-pages-deploy/.nojekyll
          cd gh-pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: ${{ github.sha }} ($DIR)"
            git push origin HEAD:gh-pages
          fi

      # peter-evans/create-or-update-comment has no built-in "find my previous
      # comment" input (an earlier version of this workflow assumed a
      # `comment-tag` input that doesn't actually exist in v4 - confirmed by a
      # real CI run warning "Unexpected input(s) 'comment-tag'" and two
      # separate comments landing on the same PR). find-comment locates the
      # marker below explicitly; its output feeds comment-id so the next step
      # edits that comment instead of creating a new one.
      - name: Find previous report comment
        if: always() && steps.report_meta.outcome == 'success' && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: <!-- playwright-report-comment -->

      - name: Comment report link on the PR
        if: always() && steps.report_meta.outcome == 'success' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- playwright-report-comment -->
            ### Playwright report — ${{ steps.run_tests.outcome == 'success' && '✅ all tests passed' || '❌ some tests failed' }}

            [View the full HTML report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.report_meta.outputs.dir }}/) — includes a video of every test and an in-browser trace viewer, no download needed.

            Commit: ${{ github.event.pull_request.head.sha }} · Run: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  cleanup-pr-report:
    name: Remove closed PR's report from gh-pages
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A closed PR (merged or not) has no reviewer left to send back to its
      # report link - reports/pr-<number> is safe to delete outright rather
      # than just stop growing it. See DECISIONS.md ("Stop gh-pages report
      # directories from growing forever").
      - name: Delete reports/pr-<number>
        run: |
          DIR="reports/pr-${{ github.event.pull_request.number }}"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages-clean origin/gh-pages
            if [ -d "gh-pages-clean/$DIR" ]; then
              rm -rf "gh-pages-clean/$DIR"
              cd gh-pages-clean
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "cleanup: remove $DIR (PR closed)"
              git push origin HEAD:gh-pages
            fi
          fi
